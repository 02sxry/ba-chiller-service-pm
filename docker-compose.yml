services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ba_chiller
      POSTGRES_USER: ba_chiller
      POSTGRES_PASSWORD: ba_chiller
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_chiller -d ba_chiller"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ba_chiller_pgdata:/var/lib/postgresql/data

volumes:
  ba_chiller_pgdata:

