services:
  backend:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  frontend:
    build: ../../frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
  worker:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      backend: { condition: service_healthy }
    command: ["python", "-m", "app.worker"]
  scheduler:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      backend: { condition: service_healthy }
    command: ["python", "-m", "app.scheduler"]
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,worker,scheduler,caddy
      no_proxy: localhost,127.0.0.1,::1,backend,frontend,worker,scheduler,caddy
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend]
volumes:
  caddy_data:

