services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_DB: ba_chiller
      POSTGRES_USER: ba_chiller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_chiller -d ba_chiller"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  frontend:
    build: ../../frontend
    restart: unless-stopped
    depends_on: [backend]
  worker:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "app.worker"]
  scheduler:
    build: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "app.scheduler"]
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend]
volumes:
  postgres_data:
  caddy_data:

